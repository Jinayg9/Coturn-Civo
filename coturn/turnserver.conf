# ==============================================================
# Coturn TURN Server Configuration — Civo PoC
# This file is mounted into the Docker container read-only.
#
# REPLACE <CIVO_VM_PUBLIC_IP> with your actual VM public IP
# REPLACE <YOUR_TURN_SECRET> with the secret you generated
# ==============================================================

# Network — listen on all interfaces, relay from public IP
listening-ip=0.0.0.0
external-ip=<CIVO_VM_PUBLIC_IP>

# Ports
listening-port=3478
tls-listening-port=5349

# WebRTC relay port range — must match firewall rules!
min-port=49152
max-port=65535

# Authentication — use long-term credentials
lt-cred-mech
user=poctest:<YOUR_TURN_SECRET>
realm=turn.poc.coturn

# Security — block relay to private/internal IP ranges (prevents abuse)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Admin CLI — telnet to 127.0.0.1:5766 to see active sessions
cli-ip=127.0.0.1
cli-port=5766
cli-password=adminpoc123

# Logging
log-file=/var/log/coturn/turnserver.log
verbose

# Performance
no-multicast-peers
mobility
