# ==========================================================
# Coturn TURN Server — Docker Compose
# Run with: docker compose up -d
# Stop with: docker compose down
# View logs: docker compose logs -f
# ==========================================================

services:
  coturn:
    image: coturn/coturn:4.6
    container_name: coturn-poc
    # CRITICAL: Use host networking — Docker bridge doesn't
    # handle the high volume of UDP relay ports well for WebRTC
    network_mode: host
    restart: always
    volumes:
      # Mount our config file into the container (read-only)
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: -c /etc/coturn/turnserver.conf
    # Resource limits — prevent Coturn from consuming all RAM
    mem_limit: 2g
    cpus: "3.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
